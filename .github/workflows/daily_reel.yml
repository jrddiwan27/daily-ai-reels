name: Autonomous 5x Daily Reel Engine

on:
  schedule:
    # 9:00 AM IST (Slot 1: Morning Breakthrough - Open Source Repos)
    - cron: '30 3 * * *'
    # 12:00 PM IST (Slot 2: Midday Cheat Code - AI Workflows)
    - cron: '30 6 * * *'
    # 3:00 PM IST (Slot 3: Tech Radar Teardown - Model Releases)
    - cron: '30 9 * * *'
    # 6:00 PM IST (Slot 4: Evening Toolkit - Secret Web Tools)
    - cron: '30 12 * * *'
    # 9:00 PM IST (Slot 5: Night Owl Deep Dive - Master Prompts)
    - cron: '30 15 * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: 'Select Reel Slot (1-5) or leave empty for auto-detection'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - '1'
          - '2'
          - '3'
          - '4'
          - '5'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install System Dependencies & FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libasound2t64 || true

      - name: Install Python Dependencies
        run: |
          pip install -r requirements.txt

      - name: Install HyperFrames CLI & Browser
        run: |
          npm install -g hyperframes
          npx hyperframes browser ensure

      - name: Run Master 5x Pipeline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
        run: |
          if [ -n "${{ github.event.inputs.slot }}" ]; then
            python master_runner.py --slot ${{ github.event.inputs.slot }}
          else
            python master_runner.py
          fi

      - name: Persist Deduplication History
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add history/published_history.json
          git commit -m "chore(history): update published reel ledger [skip ci]" || echo "No history changes to commit"
          git pull --rebase origin main || true
          git push origin main || echo "History push succeeded or no changes"

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-reel-mp4
          path: out/daily-reel.mp4
          retention-days: 7
