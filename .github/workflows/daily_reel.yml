name: Autonomous Daily Reel Engine

on:
  schedule:
    # Runs everyday at 03:30 UTC (9:00 AM IST)
    - cron: '30 3 * * *'
  workflow_dispatch: # Allows 1-click manual trigger anytime from GitHub mobile or browser

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install System Dependencies & FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libasound2t64 || true

      - name: Install Python Dependencies
        run: |
          pip install -r requirements.txt

      - name: Install HyperFrames CLI & Browser
        run: |
          npm install -g hyperframes
          npx hyperframes browser ensure

      - name: Run Master Pipeline
        env:
          FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
        run: |
          python master_runner.py

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-reel-mp4
          path: out/daily-reel.mp4
          retention-days: 7
